name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out tracked sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.1.2
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.14.0
          cache: pnpm

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.11'

      - name: Frozen dependency install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: TypeScript tests
        run: pnpm test

      - name: Python tests
        run: pnpm test:python

      - name: Build client and server
        run: pnpm build

      - name: Reject model API key assignments
        run: pnpm secret:scan

      - name: Install Chromium
        run: pnpm test:e2e:install

      - name: Production-auth E2E
        run: pnpm test:e2e

      - name: Validate Compose example
        env:
          INDY_HERMES_HOME: /srv/indy/hermes-home
          INDY_HERMES_RUNTIME_DIR: /opt/indy/hermes-runtime
          INDY_HERMES_RUNTIME_MANIFEST_FILE: /etc/indy/hermes-runtime-manifest.json
          INDY_IMAGE: ghcr.io/example/indy@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          INDY_PROJECT_WORKSPACE: /srv/indy/workspaces/project
          INDY_PROXY_SECRET_HOST_FILE: /etc/indy/proxy-secret
          INDY_PUBLIC_ORIGIN: https://indy.example.test
          INDY_STATE_DIR: /srv/indy/state
          INDY_PRIVATE_PROXY_CIDRS: 172.20.0.1/32
          INDY_WORKSPACE_ROOT: /srv/indy/workspace
        run: |
          docker compose -f docker-compose.example.yml config --format json > "$RUNNER_TEMP/indy-compose.json"
          node -e '
            const fs = require("node:fs");
            const rendered = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const service = rendered.services.indy;
            if (service.environment.INDY_TRUSTED_PROXY_CIDRS !== "127.0.0.1/32,::1/128,172.20.0.1/32") process.exit(1);
            if (service.environment.HERMES_RUNTIME_MANIFEST_FILE !== "/run/indy-config/hermes-runtime-manifest.json") process.exit(1);
            if (service.environment.HERMES_SOURCE_DIR !== "/opt/hermes") process.exit(1);
            if (service.environment.HERMES_PRIVATE_RUNTIME_PARENT !== "/run/indy-runtime") process.exit(1);
            if (!service.configs.some((config) => config.target === "/run/indy-config/hermes-runtime-manifest.json")) process.exit(1);
            if (!service.tmpfs.includes("/run/indy-runtime:rw,nosuid,nodev,size=1g,uid=10001,gid=10001,mode=0700")) process.exit(1);
          ' "$RUNNER_TEMP/indy-compose.json"

      - name: Build production image
        run: docker build --tag indy-ci:${{ github.sha }} .

      - name: Verify image safety contract
        run: |
          test "$(docker image inspect indy-ci:${{ github.sha }} --format '{{.Config.User}}')" = "indy:indy"
          docker image inspect indy-ci:${{ github.sha }} --format '{{json .Config.Healthcheck.Test}}' | grep -F 'dist/server/server/healthcheck.js'
          docker run --rm --entrypoint node indy-ci:${{ github.sha }} dist/server/server/security/model-key-scan.js --environment
          test "$(docker image inspect indy-ci:${{ github.sha }} --format '{{index .Config.Labels "io.propulseo.indy.node-base-digest"}}')" = "sha256:1c18d9ab3af4585870b92e4dbc5cac5a0dc77dd13df1a5905cea89fc720eb05b"
          test "$(docker image inspect indy-ci:${{ github.sha }} --format '{{index .Config.Labels "io.propulseo.indy.debian-snapshot"}}')" = "20260801T000000Z"
